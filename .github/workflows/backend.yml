name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "evals/datasets/**", "evals/configs/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "evals/datasets/**", "evals/configs/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://app:ci-password@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0  # плавающего тега v10 у setup-uv нет
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app tests evals

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=80
