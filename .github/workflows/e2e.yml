name: e2e

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "demo_db/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "demo_db/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # без ключей LLM и с AGENT_MODE=fake ответы агента детерминированы
      - name: Generate .env
        run: |
          ./scripts/init-env.sh
          echo "AGENT_MODE=fake" >> .env

      - name: Start databases
        run: docker compose up -d --wait app-db target-db qdrant

      - uses: astral-sh/setup-uv@v10.3.0  # плавающего тега v10 у setup-uv нет
        with:
          enable-cache: true
          cache-dependency-glob: demo_db/uv.lock

      - name: Seed demo DB (2% объёма)
        working-directory: demo_db
        run: |
          uv sync --locked
          uv run python seed.py --scale 0.02

      - name: Start backend and frontend
        run: docker compose up -d --build --wait backend frontend

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Service logs
        if: failure()
        run: docker compose logs backend frontend

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
