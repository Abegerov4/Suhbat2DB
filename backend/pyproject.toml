[project]
name = "suhbat2db-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.146.0",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langfuse>=5.0.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "qdrant-client>=1.19.1",
    "snowballstemmer>=3.1.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "sqlglot>=30.23.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx>=0.28.1",
    "hypothesis>=6.170.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# комментарии и строки на русском: кириллица не является ошибкой
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# переменные окружения задаются до импорта приложения
"tests/conftest.py" = ["E402"]
# разметка набора: эталонный SQL читается целиком в одной строке
"evals/build_ambiguous.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["snowballstemmer"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async переключает контекст через greenlet; без этого строки после await теряются
concurrency = ["greenlet", "thread"]
